# The checks that need neither a window nor Houdini: the lint, the pure tests (tests/unit/,
# the architecture rules and the documentation included), and the build of the extension,
# which validates its manifest. The Blender and Houdini suites run on a machine with both;
# see CONTRIBUTING.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # the Python of Blender 5.2
      - name: Install numpy and ruff
        run: python -m pip install numpy ruff
      - name: Lint
        run: ruff check .
      - name: Pure tests
        run: python -m unittest discover -s tests/unit -t .

  build:
    runs-on: ubuntu-latest
    env:
      BLENDER: blender-5.2.0-linux-x64
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries Blender loads
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Download Blender 5.2
        run: curl -fsSL "https://download.blender.org/release/Blender5.2/$BLENDER.tar.xz" | tar -xJ
      - name: Build the extension
        run: |
          mkdir -p dist
          cp LICENSE addon/LICENSE
          "./$BLENDER/blender" --factory-startup --command extension build --source-dir addon --output-dir dist
          ls dist/rg_houdini_bridge-*.zip
